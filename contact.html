<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <h1>Cyberpunk 2077</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <h2><img src="images/contact.jpg" alt="">Contact Us</h2>
        <p>If you have any questions, feedback, or inquiries about Cyberpunk 2077, please feel free to reach out to us. We value your input and are here to assist you.</p>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
